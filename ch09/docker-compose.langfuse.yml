name: ch09-langfuse

# Self-hosted Langfuse v4 for the ch09 notebooks, adapted from the official
# reference (https://raw.githubusercontent.com/langfuse/langfuse/main/docker-compose.yml),
# scoped to this repo (ch09_ container/volume names) and wired to the LANGFUSE_*
# secrets in the repo-root .env instead of the CHANGEME defaults.
#
# Versions are pinned so upgrades are deliberate:
#   LANGFUSE_IMAGE_TAG            web + worker  (default 4.77.0)
#   LANGFUSE_CLICKHOUSE_IMAGE_TAG clickhouse    (default 26.3.62.3; v4 needs >= 25.12)
# Python SDK v5 needs server >= 4.59.0.
#
# Start:  docker compose --env-file .env -f ch09/docker-compose.langfuse.yml up -d
# Reset:  same command with `down -v`, then `up -d` (LANGFUSE_INIT_* re-provisions
#         the org/project/user and the fixed API keys from .env).
#
# Ports are offset from other local Langfuse stacks (text2sql-finance uses 3001).

x-langfuse-infra-deps: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4.77.0}
    container_name: ch09_langfuse_worker
    restart: unless-stopped
    # The worker binds to $HOSTNAME, not loopback; $$ escapes compose interpolation.
    healthcheck:
      test: wget --no-verbose --tries=1 --spider "http://$${HOSTNAME}:3030/api/health?failIfEventPropagationStuck=true" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Wait for web (which applies the DB migrations) so the worker's one-shot
    # boot jobs don't hit missing tables on a fresh volume.
    depends_on:
      <<: *langfuse-depends-on
      langfuse-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: minio
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      REDIS_TLS_ENABLED: "false"
      # v4's 30s Redis idle watchdog floods the worker log with "Socket timeout"
      # reconnects on a quiet local stack. 0 disables it; drop this for production.
      REDIS_SOCKET_TIMEOUT_MS: "0"

  langfuse-web:
    image: docker.io/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4.77.0}
    container_name: ch09_langfuse_web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    # Healthy once migrations are applied and the server is up.
    healthcheck:
      test: wget --no-verbose --tries=1 --spider "http://$${HOSTNAME}:3000/api/public/health" || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # Auto-provision an org/project/user + a fixed API key pair on first boot,
      # so the notebook never needs a manual signup-through-the-UI step.
      LANGFUSE_INIT_ORG_ID: ch09-eval-org
      LANGFUSE_INIT_ORG_NAME: "CH09 Eval Org"
      LANGFUSE_INIT_PROJECT_ID: ch09-eval-project
      LANGFUSE_INIT_PROJECT_NAME: "CH09 External Eval Pipelines"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: "CH09 Admin"
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:${LANGFUSE_CLICKHOUSE_IMAGE_TAG:-26.3.62.3}
    container_name: ch09_langfuse_clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - ch09_langfuse_clickhouse_data:/var/lib/clickhouse
      - ch09_langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:19020:9000"  # host-side only; 9008-9012 clash with Jupyter kernel ports
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    container_name: ch09_langfuse_minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - ch09_langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    container_name: ch09_langfuse_redis
    restart: unless-stopped
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH}
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ch09_langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    container_name: ch09_langfuse_postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ch09_langfuse_postgres_data:/var/lib/postgresql/data

volumes:
  ch09_langfuse_postgres_data:
    driver: local
  ch09_langfuse_clickhouse_data:
    driver: local
  ch09_langfuse_clickhouse_logs:
    driver: local
  ch09_langfuse_minio_data:
    driver: local
  ch09_langfuse_redis_data:
    driver: local
